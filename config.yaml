# config.yaml — all tunable constants for the Mutual Fund FAQ Assistant.
# Transcribed from architecture.md §20. Secrets never live here (see .env.example).
# Nothing below may be duplicated as a literal in stage code (architecture.md §18.2).

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  chroma_dir: data/chroma
  chunks_dump: data/chunks.jsonl
  vectors_dump: data/chunks_and_vectors.txt
  sources_csv: data/sources.csv
  model_cache_dir: data/models

embedding:
  model_id: sentence-transformers/all-MiniLM-L6-v2   # mandated by the brief
  batch_size: 32
  device: cpu
  normalize: true

chunking:
  strategy: semantic_section          # | fixed_512   (ablation A1)
  max_tokens: 600
  min_tokens: 80
  overlap_tokens: 60                  # prose only; suppressed on FEES/TAX sections
  preserve_tables: true
  include_context_header: true
  drop_boilerplate: true
  merge_small_sections: true

chroma:
  collection_name: mf_faq_hdfc_v1
  space: cosine
  description: HDFC AMC MF FAQ facts v1

retrieval:
  dense_k: 12
  top_n: 5
  mmr_lambda: 0.3
  context_token_budget: 1800
  gate_threshold: 0.35               # calibrated by eval/run_eval.py per architecture.md §12
  unclassified_gate_margin: 0.10
  require_term_coverage: true
  # When a scheme is resolved, restrict the candidate pool to it (architecture.md §11.3) or keep
  # all schemes and let the +0.02 scheme boost and MMR do the disambiguation. Measured in Phase 6:
  # top-1 is identical either way on the spec queries, but a global pool is what lets MMR pick
  # across schemes (§11.5) and makes the scheme boost meaningful. The filter is the default
  # because a hard in-scheme constraint is the stronger guarantee for the citation, and a
  # cross-scheme slip is a confidently wrong fee. Flip for the Phase 11 ablation.
  scheme_filter: true
  boosts:
    fact_term: 0.05
    additional_fact_term: 0.05
    section_type_match: 0.03
    scheme_match: 0.02
  fact_terms:                         # FactFamily -> surface forms used for term-coverage checks
    expense_ratio: ["expense ratio", "ter", "expense ratio and other fees", "charges"]
    exit_load: ["exit load", "exit charges", "load"]
    min_sip: ["minimum sip", "min sip", "min. for sip", "min. for", "minimum investment", "minimum amount", "sip", "systematic investment plan", "lump sum", "lumpsum"]
    # "tax saver" was here in Phase 6 and is deliberately gone: it is a scheme alias, present in the
    # scheme name of every S3 chunk, so it satisfied term coverage for a lock-in question whose answer
    # is not in the corpus. The gate must fail "is there a lock-in?" honestly rather than answer with
    # a sentence that never mentions a lock-in. docs/corpus_matrix.md records the gap.
    # "elss" was later re-added here and is now gone for the same reason: it is the S3 scheme alias
    # in registry.scheme_aliases, so its presence in any S3 chunk header satisfied lock-in coverage
    # and let a tax-section chunk about redeeming within one year answer a lock-in question.
    lock_in: ["lock-in", "lock in", "3 years", "80c", "lockin period"]
    riskometer: ["riskometer", "risk", "risk rating"]
    benchmark: ["benchmark", "index"]
    statements: ["capital gains", "statement", "tax report", "download", "capital gains statement"]
    aum: ["aum", "assets under management", "asset under management"]
    direct_vs_regular: ["direct", "regular", "direct plan", "regular plan", "direct vs regular"]
    growth_vs_idcw: ["growth", "idcw", "dividend", "growth vs idcw", "growth option", "idcw option"]
    kyc: ["kyc", "know your customer"]
    nominee: ["nominee", "nomination"]
    cutoff_time: ["cut-off", "cutoff", "cut off time", "cut-off time", "cutoff time"]
    nav: ["nav", "net asset value", "net asset value per unit"]

generation:
  # Default to the extractive, fully local generator. It is grounded, needs no key, makes zero
  # network calls, answers in ~0.7 s, and never 429s. Set to "auto"/"llm" to use the optional
  # free-tier LLM via .env (README §"The LLM is optional"); answers stay guarded either way.
  provider: extractive                # auto | llm | extractive   (ablation A4)
  model: ""                           # empty => read LLM_MODEL from .env at call time
  temperature: 0.1
  max_tokens: 220
  timeout_s: 8
  retries: 1

loading:
  offline_cache_first: true
  request_delay_s: 1.0
  timeout_s: 20
  retries: 3
  min_extracted_chars: 400
  # hdfcmutualfund.com is not HDFC's domain and is removed. hdfcfund.com is the real AMC domain
  # but returns HTTP 403 to a scripted client, so it is not fetchable and is therefore absent here
  # (docs/corpus_matrix.md §3). www.* entries are the canonical forms the regulator publishes under
  # and are listed alongside the bare domain rather than by suffix, so a lookalike host such as
  # "amfiindia.com.evil.test" still fails constraint C1.
  # www.sebi.gov.in backs the EDU03/08/10/11/13/14/16 citations (SEBI circulars),
  # www.camsonline.com the EDU18 citation (NSE Clearing capital-gains statement) and
  # www.incometax.gov.in the EDU19 citation (income-tax portal). Those three rows are ingested from
  # repository files, so nothing is fetched from them; listing them is what lets the citation pass C1.
  allowed_hosts:
    [groww.in, amfiindia.com, www.amfiindia.com, sebi.gov.in, www.sebi.gov.in, www.camsonline.com,
     www.incometax.gov.in, localhost]

  # Blocks that carry performance figures are dropped at ingest rather than merely refused at
  # query time. PRD constraint C3 says the system never returns, computes, or compares
  # returns/NAV/performance; a retrievable return table would be a chunk the retriever can
  # surface, and no prompt or post-filter makes that safe. Every source page embeds a
  # "Return calculator" widget whose historical-return table is exactly that risk.
  # Matched case-insensitively as a substring of any class attribute, so the hashed CSS-module
  # suffixes Groww emits (returnStats_tickerContainer___25d1) are caught by their stable prefix.
  # "compareSimilarFunds" is the cross-fund 1Y/3Y return table and "mfGraph" is the NAV chart
  # with its 1M/6M/1Y range buttons; both survived the first pass and both were found by reading
  # data/processed/ rather than by assuming the spike was representative.
  # The remaining entries are site chrome, not facts. They are removed here for the same reason
  # the table rows must survive: an A-Z product index or a mega-menu of calculators is ~150 lines
  # of noise that the §8.5 boilerplate filter can only partly catch, because lines like "1M 6M
  # 1Y 3Y 5Y All" contain digits and pass the "short and digitless" test.
  drop_class_substrings:
    - returnCalculator
    - returnStats
    - returnsAndRankings
    - compareSimilarFunds
    - mfGraph
    - loggedOut_hover
    - loggedOut_navContainer
    - letterLinks
    - footerTopSection
    - footer_other

guardrails:
  max_sentences: 3
  enforce_numeric_grounding: true
  banned_terms: [should, recommend, advisable, best, outperform, guaranteed, return, returns, nav, buy, sell, hold, suitable]

# Streamlit chrome and the example-question chips (architecture.md §16). The chips are exactly
# three on load and swap to factual examples after a refusal (PRD FR-41), because a demo that
# offers three advice questions first would open with three refusals.
ui:
  title: "Mutual Fund Assistant"
  scope_line: "Facts-Only · Grounded in official mutual fund sources"
  hero_title: "Groww MF Intelligence"
  hero_body: "Ask factual questions about the covered schemes — expense ratios, exit loads, minimum SIP amounts, lock-in periods and tax treatment. Every answer is lifted from the retrieved source and carries a link to it."
  badge_verified: "Verified Source Bot"
  badge_no_advice: "No Advice · Informational Only"
  placeholder: "Ask a factual question (e.g. minimum SIP, benchmark, TER)…"
  link_label: "View Filing"
  sources_label: "Sources used"
  index_missing_title: "No index found"
  index_missing_message: "This app needs the offline index before it can answer anything. From the project root, run:"
  # Header nav and breadcrumb, from the Stitch wireframe's top bar.
  nav_links: ["Explore", "Investments", "Mutual Funds", "AI FAQ Assistant"]
  nav_active_link: "AI FAQ Assistant"
  breadcrumb: ["Home", "Mutual Funds", "AI FAQ & Statutory Document Assistant"]
  footer_disclaimer: "Mutual fund investments are subject to market risks. Read all scheme related documents carefully."
  footer_links: ["Statutory Disclosures", "Terms of Use", "Privacy Policy", "SEBI Circulars"]
  privacy_note: "Privacy Safeguard: Do not provide PAN, Folio IDs, or bank credentials."
  chip_row_label: "Popular Factual Queries"
  example_questions:
    - "What is the expense ratio of the HDFC Large Cap fund?"
    - "What is the exit load on the HDFC Small Cap fund?"
    - "What is the minimum SIP amount for the HDFC ELSS tax saver fund?"
  example_questions_after_refusal:
    - "What is the risk rating of the HDFC Flexi Cap fund?"
    - "What is the benchmark of the HDFC Balanced Advantage fund?"
    - "What is the minimum SIP amount for the HDFC Large Cap fund?"

registry:
  known_other_amcs: [parag, axis, icici, sbi, kotak, tata nippon, nippon, quant, mahindra, icici prudential]
  # Ordered longest-first alias match (architecture.md §11.3). Longest-first is mandatory: with a
  # shortest-first pass "tax saver" can be shadowed by a shorter alias and mis-resolve a query.
  scheme_aliases:
    S1: ["large cap", "largecap", "hdfc large cap", "large cap fund"]
    S2: ["flexi cap", "flexicap", "equity fund", "hdfc equity fund"]
    S3: ["elss", "tax saver", "tax saving", "taxsaver", "elss tax saver", "80c"]
    S4: ["small cap", "smallcap", "hdfc small cap", "small cap fund"]
    S5: ["balanced advantage", "balancedadvantage", "balanced advantage fund"]
  # Refusal/redirect links. They are rendered to the user, never ingested or chunked, so they do
  # not need to be fetchable. Every URL below was checked against docs/corpus_matrix.md §3.
  education_url: "https://www.amfiindia.com/"   # verified HTTP 200
  help_url: "https://groww.in/help"            # verified HTTP 200
  # UNRESOLVED: no official factsheet index is fetchable (HDFC's own is 403, and the
  # groww.in/mutual-funds/<scheme>/factsheet path 404s). Left empty on purpose so the system
  # degrades to the scheme page instead of shipping an invented URL. Resolve before Phase 8.
  factsheet_index_url: ""

# Single source of truth for every user-visible string (architecture.md §20 closing note).
# src/templates.py exposes these as module constants; the UI, the refusal paths and the README
# all quote this text so the deliverable "disclaimer snippet" can never drift (PRD §12).
copy:
  ui_disclaimer: >-
    **Facts-only. No investment advice.** This assistant shares publicly available factual
    information about HDFC AMC schemes and is not a SEBI-registered investment adviser. It does
    not recommend buying, selling, or holding any fund, and it does not provide return, NAV, or
    performance figures. Information may change — always verify on the linked official source page.

  refusal_message: >-
    I can only share facts — I can't recommend funds or suggest what to do with your money. Here's
    an official investor-education page instead: {link}. Ask me anything factual (expense ratio,
    exit load, minimum SIP, lock-in, benchmark, statements) and I'll answer with a source.

  performance_redirect: >-
    I don't provide or compare returns, NAVs, or performance figures. The official factsheet for
    this scheme has the published figures: {link}.

  pii_refusal: >-
    Please don't share personal identifiers like PAN, Aadhaar, account numbers, or OTPs — I won't
    store them. For account-specific help, use the official support channel: {link}.

  out_of_corpus_message: >-
    My sources cover only HDFC AMC's {scheme_count} schemes ({schemes}), all facts-only. I can't
    answer from a page I don't have — please treat anything about other funds as unverified here.
    If you meant an in-scope scheme, I can share its documented facts: {link}

  not_in_corpus_message: >-
    I don't have that in my sources for the {scheme_count} HDFC AMC schemes I cover, so I won't
    guess. The official scheme page is the place to check: {link}

  smalltalk_message: >-
    I'm a facts-only assistant for {scheme_count} HDFC AMC mutual fund schemes. I can tell you the
    expense ratio, exit load, minimum SIP, ELSS lock-in, riskometer, benchmark, and how to download
    statements — each answer with one official source link. I never give investment advice.

  # Rotating greeting templates for LLM fallback (used when LLM is unavailable)
  greeting_templates:
    - "Hi there! Great to see you. I can explain mutual fund basics and share facts about {scheme_count} HDFC schemes. What would you like to know?"
    - "Hello! I'm ready to help with HDFC mutual fund facts — expense ratios, exit loads, SIP minimums, lock-ins, and more. What's on your mind?"
    - "Hey! Happy to assist. Ask me anything about the HDFC schemes I cover."
    - "Hi! I can share verified facts about HDFC mutual fund schemes. What would you like to learn?"

  # Unclear question handling
  unclear_replies:
    - "I want to make sure I give you the right answer. Could you clarify what you'd like to know? For example: \"What is the exit load for HDFC Small Cap?\" or \"What is NAV?\""
    - "Could you rephrase that? I can help with things like expense ratios, exit loads, minimum SIP amounts, lock-in periods, benchmarks, and risk ratings for HDFC funds."
    - "I'm not sure I caught that. Try asking about a specific fund fact (e.g., \"exit load of HDFC Flexi Cap\") or a general concept (e.g., \"what is NAV?\")."

  unclear_examples:
    - "What is the expense ratio of HDFC Large Cap?"
    - "What is NAV?"

# Intent router (src/intent_router.py). The rule-based pass always runs.
# llm_fallback adds a SECOND third-party LLM call that ships the question and the last four
# conversation turns to the configured endpoint. It is off by default so that holding a key for
# generation does not silently opt the deployment into that egress. Turn it on only if the extra
# privacy surface and the doubled latency/quota are acceptable.
intent_router:
  llm_fallback: false