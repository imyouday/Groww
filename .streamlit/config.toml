# Streamlit runtime configuration.
#
# Python version is deliberately NOT pinned here. Streamlit Community Cloud ignores runtime.txt,
# .python-version and config.toml for interpreter selection; the version is chosen in the deploy
# dialog's "Advanced settings" and cannot be changed without deleting and redeploying the app.
# Use 3.11 there, because the pinned torch/tokenizers/transformers trio only resolves on 3.11.
#
# Usage stats are off: architecture.md NFR-7 requires no telemetry, and Streamlit's own counter is
# a telemetry channel like any other. The app theme is deliberately NOT set here, because
# src/theme.py owns the light/dark toggle and a [theme] block would fight it.
#
# server.headless is required on a hosted host: there is no browser to open.
#
# NOTE: save as UTF-8 *without* a byte-order mark. Streamlit parses TOML with a minimal reader
# that treats the BOM as part of the first key name.
[browser]
gatherUsageStats = false

[server]
headless = true